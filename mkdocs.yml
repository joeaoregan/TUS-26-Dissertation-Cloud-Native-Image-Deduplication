site_name: Cloud-Native Perceptual Image Deduplication
site_description: Dissertation project phase notes and technical documentation
docs_dir: docs
site_dir: site
theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - content.code.copy
    - toc.follow
    - navigation.footer
    - navigation.instant.preview
    - navigation.tracking
    - navigation.path
    - navigation.top

  palette: 
    # Palette toggle for dark mode
    - scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    # Palette toggle for light mode
    - scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode

  logo: images/logo.png
  favicon: images/favicon.ico

nav:
  - Home:
    - Overview: index.md
    - External Links:
      - GitHub Repository: https://github.com/joeaoregan/TUS-26-Dissertation-Cloud-Native-Image-Deduplication
  - Phase Notes:
      - Overview: phase-notes/index.md
      - 01 - Local Pipeline Foundation: phase-notes/01-local-pipeline-foundation.md
      - 02 - Benchmarking and Evaluation Framework: phase-notes/02-benchmarking-and-evaluation-framework.md
      - 03 - Threshold Tuning and Reproducibility Baseline: phase-notes/03-threshold-tuning-and-reproducibility-baseline.md
      - 04 - Containerisation and Runtime Configuration: phase-notes/04-containerisation-and-runtime-configuration.md
      - 05 - Async Job Orchestration and Worker Model: phase-notes/05-async-job-orchestration-and-worker-model.md
      - 06 - Observability and Resilience Hardening: phase-notes/06-observability-and-resilience-hardening.md
      - 07 - Cloud Deployment and Scale Validation: phase-notes/07-cloud-deployment-and-scale-validation.md
  - Features:
      - Overview: features/index.md
markdown_extensions:
  - admonition
  - toc:
      permalink: true

  - pymdownx.tasklist:
      custom_checkbox: true
  - def_list
  - pymdownx.superfences
  
  - material.extensions.preview:
      configurations:
        - targets:
            include:
              - index.md

repo_url: https://github.com/joeaoregan/TUS-26-Dissertation-Cloud-Native-Image-Deduplication
repo_name: GitHub