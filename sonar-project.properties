# --------------------------------------------
# SonarQube / SonarCloud project configuration
# --------------------------------------------

# Adjust these 3 to your project
sonar.projectKey=TUS-26-Dissertation-Cloud-Native-Image-Deduplication
sonar.projectName=TUS-26-Dissertation-Cloud-Native-Image-Deduplication
sonar.projectVersion=1.0

sonar.projectBaseDir=.

# Focus on Python service code
sonar.sources=services/dedupe-py
sonar.tests=tests

# Python
sonar.sourceEncoding=UTF-8
sonar.python.version=3.13

# pytest --cov=. --cov-report=xml
sonar.python.coverage.reportPaths=coverage.xml

# pytest --junitxml=pytest-report.xml
sonar.python.xunit.reportPath=pytest-report.xml

# --------------------------------------------
# Exclusions (generated/output/venv/noise)
# --------------------------------------------
sonar.exclusions=\
**/.git/**,\
**/.venv/**,\
**/venv/**,\
**/__pycache__/**,\
**/*.pyc,\
**/.pytest_cache/**,\
**/.mypy_cache/**,\
**/.ruff_cache/**,\
**/.idea/**,\
**/.vscode/**,\
**/node_modules/**,\
**/dist/**,\
**/build/**,\
**/.scannerwork/**,\
**/data/**,\
**/logs/**,\
**/submission/**,\
**/docs/**

# --------------------------------------------
# Duplication exclusions (focus CPD on real code)
# --------------------------------------------
sonar.cpd.exclusions=\
**/data/reviews/review_pairs_stage*.html,\
**/submission/data/reviews/review_pairs_stage*.html